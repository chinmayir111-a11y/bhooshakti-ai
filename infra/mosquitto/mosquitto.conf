# BHOOSHAKTI AI — Mosquitto broker for simulated sensor telemetry.
#
# Local demo settings: anonymous access on the loopback/container network.
# A real deployment terminates TLS and authenticates every node — see
# DEPLOYMENT.md, "Sensor ingest" — do NOT ship allow_anonymous to production.

listener 1883 0.0.0.0
allow_anonymous true

# Optional WebSocket listener so a browser client could subscribe directly.
listener 9001 0.0.0.0
protocol websockets

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
